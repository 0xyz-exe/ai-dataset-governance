[project]
name = "ai-dataset-governance"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "0xyz-exe", email = "danielachmadf@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pytest>=9.2.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.34.0",
]

[project.scripts]
dataset-governance = "cli.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
